<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Carryover call architecture</title>
  <style>
    svg {
      --bg: #ffffff;
      --ink: #17181c;
      --sub: #55585f;
      --box: #f4f5f7;
      --box-border: #c7cad1;
      --server-border: #9aa0ab;
      --accent: #b3261e;
      --accent-soft: #f6dcd9;
      --aai: #0b5fff;
      --aai-soft: #dde8ff;
      --planned-border: #b9bcc3;
      --planned-fill: #fbfbfc;
      --planned-text: #8b8f98;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #14151a;
        --ink: #eef0f4;
        --sub: #a7abb6;
        --box: #1e2027;
        --box-border: #3a3d47;
        --server-border: #565b68;
        --accent: #ff6f66;
        --accent-soft: #3a2523;
        --aai: #7aa2ff;
        --aai-soft: #1c2740;
        --planned-border: #3a3d47;
        --planned-fill: #191a1f;
        --planned-text: #72757e;
      }
    }
    text { fill: var(--ink); }
    .sub { fill: var(--sub); }
    .box { fill: var(--box); stroke: var(--box-border); stroke-width: 1.5; }
    .inner { fill: var(--bg); stroke: var(--box-border); stroke-width: 1.2; }
    .server { fill: none; stroke: var(--server-border); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .brainbox { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .aaibox { fill: var(--aai-soft); stroke: var(--aai); stroke-width: 1.5; }
    .planned { fill: var(--planned-fill); stroke: var(--planned-border); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .planned text { fill: var(--planned-text); }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 11.5px; }
    .tiny { font-size: 10.5px; }
    .edge { fill: none; stroke: var(--sub); stroke-width: 1.4; marker-end: url(#arrow); }
    .edgeAai { fill: none; stroke: var(--aai); stroke-width: 1.6; marker-end: url(#arrowAai); }
    .edgeBrain { fill: none; stroke: var(--accent); stroke-width: 1.6; marker-end: url(#arrowBrain); }
    .edgeLabel { font-size: 10.5px; fill: var(--sub); }
    .edgeLabelAai { font-size: 10.5px; fill: var(--aai); }
    .edgeLabelBrain { font-size: 10.5px; fill: var(--accent); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sub)"/>
    </marker>
    <marker id="arrowAai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--aai)"/>
    </marker>
    <marker id="arrowBrain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="980" fill="var(--bg)"/>
  <text x="30" y="34" class="title">Carryover — call architecture</text>
  <text x="30" y="55" class="small sub">One CallSession orchestrates two independent AssemblyAI sessions on the same audio, plus a BYO-LLM endpoint that gates every generated word.</text>

  <!-- legend -->
  <g class="tiny sub">
    <line x1="30" y1="72" x2="55" y2="72" stroke="var(--sub)" stroke-width="1.4"/>
    <text x="60" y="76">control / data</text>
    <line x1="170" y1="72" x2="195" y2="72" stroke="var(--aai)" stroke-width="1.8"/>
    <text x="200" y="76" fill="var(--aai)">AssemblyAI session (audio)</text>
    <line x1="380" y1="72" x2="405" y2="72" stroke="var(--accent)" stroke-width="1.8"/>
    <text x="410" y="76" fill="var(--accent)">BYO-LLM, fact-gated</text>
    <line x1="570" y1="72" x2="595" y2="72" stroke="var(--planned-border)" stroke-width="1.8" stroke-dasharray="4 4"/>
    <text x="600" y="76">planned, not shipped</text>
  </g>

  <!-- Clients -->
  <rect x="30" y="90" width="230" height="66" rx="10" class="box"/>
  <text x="145" y="116" text-anchor="middle" class="label">Web app</text>
  <text x="145" y="133" text-anchor="middle" class="small sub">React SPA · REST + WS</text>
  <text x="145" y="148" text-anchor="middle" class="tiny sub">landing · start · call screen</text>

  <rect x="940" y="90" width="230" height="66" rx="10" class="box"/>
  <text x="1055" y="116" text-anchor="middle" class="label">MCP client</text>
  <text x="1055" y="133" text-anchor="middle" class="small sub">another agent / automation</text>
  <text x="1055" y="148" text-anchor="middle" class="tiny sub">place_call · say · answer_ask</text>

  <!-- Server container (now includes legs: everything under apps/server/src) -->
  <rect x="20" y="192" width="1160" height="608" rx="14" class="server"/>
  <text x="40" y="215" class="small sub">apps/server/src</text>

  <!-- API layer -->
  <rect x="60" y="232" width="1080" height="58" rx="10" class="box"/>
  <text x="600" y="255" text-anchor="middle" class="label">API — REST · WebSocket · MCP</text>
  <text x="600" y="273" text-anchor="middle" class="tiny sub">api/{routes,appSocket,lineSocket,mcp}.ts — rate limit · body-size guard · zod validation</text>

  <!-- CallSession -->
  <rect x="60" y="325" width="500" height="300" rx="10" class="box"/>
  <text x="90" y="351" class="label">CallSession</text>
  <text x="90" y="368" class="tiny sub">call/callSession.ts — one per call</text>

  <rect x="90" y="384" width="210" height="66" rx="8" class="inner"/>
  <text x="195" y="406" text-anchor="middle" class="small" font-weight="700">PoliteQueue</text>
  <text x="195" y="422" text-anchor="middle" class="tiny sub">holds typed text until the</text>
  <text x="195" y="436" text-anchor="middle" class="tiny sub">line is free to speak</text>

  <rect x="330" y="384" width="210" height="66" rx="8" class="inner"/>
  <text x="435" y="406" text-anchor="middle" class="small" font-weight="700">LineStateTracker</text>
  <text x="435" y="422" text-anchor="middle" class="tiny sub">menu · hold · human ·</text>
  <text x="435" y="436" text-anchor="middle" class="tiny sub">voicemail, from captions + level</text>

  <rect x="90" y="470" width="210" height="60" rx="8" class="inner"/>
  <text x="195" y="493" text-anchor="middle" class="small" font-weight="700">SpeakerMap</text>
  <text x="195" y="509" text-anchor="middle" class="tiny sub">new-speaker detection</text>

  <rect x="330" y="470" width="210" height="60" rx="8" class="inner"/>
  <text x="435" y="493" text-anchor="middle" class="small" font-weight="700">Outbound</text>
  <text x="435" y="509" text-anchor="middle" class="tiny sub">RealtimePacer, 100 ms μ-law</text>

  <text x="90" y="565" class="tiny sub">registered via CallRegistry (call/callRegistry.ts)</text>
  <text x="90" y="582" class="tiny sub">on end(): closes Voice Agent + captions + leg first,</text>
  <text x="90" y="597" class="tiny sub">then summarize() → CallSummary + .ics</text>
  <text x="90" y="614" class="tiny sub">captions finals + typed text feed the fact-gate ledger</text>

  <!-- Relay Brain -->
  <rect x="600" y="325" width="540" height="300" rx="10" class="brainbox"/>
  <text x="630" y="351" class="label">Relay Brain</text>
  <text x="630" y="368" class="tiny sub">brain/ — POST /brain/v1/chat/completions (BYO-LLM)</text>

  <rect x="630" y="384" width="230" height="66" rx="8" class="inner" stroke="var(--accent)"/>
  <text x="745" y="406" text-anchor="middle" class="small" font-weight="700">policy.ts</text>
  <text x="745" y="422" text-anchor="middle" class="tiny sub">decide(): verbatim ·</text>
  <text x="745" y="436" text-anchor="middle" class="tiny sub">silence · proxy</text>

  <rect x="890" y="384" width="230" height="66" rx="8" class="inner" stroke="var(--accent)"/>
  <text x="1005" y="406" text-anchor="middle" class="small" font-weight="700">requestParse.ts</text>
  <text x="1005" y="422" text-anchor="middle" class="tiny sub">call tag · relay nonce ·</text>
  <text x="1005" y="436" text-anchor="middle" class="tiny sub">last role / tool</text>

  <rect x="630" y="470" width="490" height="95" rx="8" class="inner" stroke="var(--accent)"/>
  <text x="875" y="493" text-anchor="middle" class="small" font-weight="700">factGate.ts — code-enforced fabrication gate</text>
  <text x="875" y="511" text-anchor="middle" class="tiny sub">every generated sentence: dates · digit runs (3+) · emails must already be</text>
  <text x="875" y="526" text-anchor="middle" class="tiny sub">in the call's ledger (consented facts, typed text, what the other party said)</text>
  <text x="875" y="541" text-anchor="middle" class="tiny sub">blocked → filler spoken + ask card raised, never a fabricated value</text>

  <text x="630" y="590" class="tiny sub">llm/provider.ts → LLM_PROVIDER = venice (default) or aai-gateway</text>
  <text x="630" y="606" class="tiny sub">(AssemblyAI LLM Gateway, llm-gateway.assemblyai.com)</text>

  <!-- Legs row (still apps/server code) -->
  <rect x="60" y="700" width="330" height="90" rx="10" class="box"/>
  <text x="225" y="726" text-anchor="middle" class="label">Browser leg</text>
  <text x="225" y="744" text-anchor="middle" class="tiny sub">practice line — QR / code, μ-law over</text>
  <text x="225" y="759" text-anchor="middle" class="tiny sub">WebSocket, AudioWorklet encode/decode</text>
  <text x="225" y="777" text-anchor="middle" class="tiny sub">legs/browserLeg.ts, legs/lineCodes.ts</text>

  <rect x="410" y="700" width="380" height="90" rx="10" class="box"/>
  <text x="600" y="726" text-anchor="middle" class="label">Scenario leg</text>
  <text x="600" y="744" text-anchor="middle" class="tiny sub">simulated business — IVR / hold / voicemail nodes</text>
  <text x="600" y="759" text-anchor="middle" class="tiny sub">+ a second inline Voice Agent session as the "rep"</text>
  <text x="600" y="777" text-anchor="middle" class="tiny sub">legs/scenarioLeg.ts, scenarios/engine.ts</text>

  <rect x="810" y="700" width="330" height="90" rx="10" class="planned"/>
  <text x="975" y="726" text-anchor="middle" class="label">PSTN leg — planned</text>
  <text x="975" y="744" text-anchor="middle" class="tiny">PhoneLeg interface exists;</text>
  <text x="975" y="759" text-anchor="middle" class="tiny">Twilio wiring not shipped</text>
  <text x="975" y="777" text-anchor="middle" class="tiny">legs/phoneLeg.ts</text>

  <!-- AssemblyAI cloud services (external to apps/server) -->
  <rect x="30" y="850" width="530" height="100" rx="10" class="aaibox"/>
  <text x="60" y="877" class="label">AssemblyAI Voice Agent API</text>
  <text x="60" y="895" class="tiny sub">ears + mouth · stored agent · PCMU 8 kHz in/out</text>
  <text x="60" y="910" class="tiny sub">tool calling · reply.create (verbatim relay nonce)</text>
  <text x="60" y="928" class="tiny sub">aai/voiceAgent.ts, aai/agentRegistry.ts</text>

  <rect x="600" y="850" width="570" height="100" rx="10" class="aaibox"/>
  <text x="630" y="877" class="label">Universal-3.5 Pro streaming</text>
  <text x="630" y="895" class="tiny sub">independent live captions on the same audio</text>
  <text x="630" y="910" class="tiny sub">speaker_labels · per-word confidence · keyterms_prompt ·</text>
  <text x="630" y="925" class="tiny sub">agent_context · voice_focus · continuous_partials</text>
  <text x="630" y="940" class="tiny sub">aai/captions.ts</text>

  <!-- edges: control/data -->
  <path class="edge" d="M145,156 L145,232"/>
  <text x="150" y="200" class="edgeLabel">HTTP + WS</text>

  <path class="edge" d="M1055,156 L1055,190 L1100,190 L1100,232"/>
  <text x="960" y="185" class="edgeLabel">MCP tool calls</text>

  <path class="edge" d="M400,290 L310,325"/>
  <text x="330" y="312" class="edgeLabel">create / control</text>

  <path class="edge" d="M560,480 L600,480"/>
  <text x="562" y="472" class="edgeLabel">brainView()</text>

  <path class="edge" d="M225,625 L225,700"/>
  <path class="edge" d="M400,625 L600,700"/>
  <path class="edge planned" d="M500,625 L975,700"/>
  <text x="235" y="665" class="edgeLabel">μ-law audio, both ways with the other party</text>

  <!-- edges: AssemblyAI audio (route around the legs row via the margins) -->
  <path class="edgeAai" d="M60,550 L15,550 L15,900 L30,900"/>
  <text x="10" y="700" class="edgeLabelAai" transform="rotate(-90 10 700)">audio, both ways</text>

  <path class="edgeAai" d="M540,625 L540,665 L800,665 L800,850"/>
  <text x="545" y="655" class="edgeLabelAai">inbound audio (captions only)</text>

  <!-- edge: Voice Agent's BYO-LLM call back into the Relay Brain (routed through the
       clear y800-830 corridor between the legs row and the AssemblyAI row, then up the
       right margin outside the PSTN box, so it never crosses another box) -->
  <path class="edgeBrain" d="M560,860 L560,824 L1155,824 L1155,580 L1142,580"/>
  <text x="600" y="817" class="edgeLabelBrain">BYO-LLM: POST /brain/v1/chat/completions</text>
</svg>
